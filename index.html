<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Villa Selene — A Private Hilltop Estate</title>
<meta name="description" content="Villa Selene: an ultra-private hilltop residence. A cinematic tour through arrival, light, and stone." />

<!-- Fonts: Fraunces (display serif) + Inter (UI sans), preloaded with swap -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="preload"
  as="style"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap"
  onload="this.onload=null;this.rel='stylesheet'"
/>
<noscript>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
</noscript>

<!-- Preload the only asset that matters before first paint -->
<link rel="preload" as="image" href="assets/video/poster.jpg" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ============================= PRELOADER ============================= -->
<div id="preloader" aria-hidden="true">
  <div class="preloader__word" id="preloaderWord" data-text="Villa Selene"></div>
  <div class="preloader__rule"></div>
</div>
<div id="curtain"></div>

<!-- ============================= CUSTOM CURSOR ============================= -->
<div id="cursor" aria-hidden="true">
  <span class="cursor__dot"></span>
  <span class="cursor__ring"><span class="cursor__ring-label"></span></span>
</div>

<!-- ============================= NAV ============================= -->
<header id="siteNav" class="nav">
  <a class="nav__mark" id="navMark" href="#">Villa Selene</a>
  <nav class="nav__links" id="navLinks"><!-- populated per chapter --></nav>
</header>

<!-- Fixed chapter-number readout, crossfades between chapters -->
<div id="chapterIndex" class="chapter-index" aria-hidden="true">
  <span class="chapter-index__current">01</span>
  <span class="chapter-index__rule"></span>
  <span class="chapter-index__total">02</span>
</div>

<!-- ============================= CHAPTERS (generated by main.js) ============================= -->
<main id="chapters"></main>

<!-- ============================= FOOTER ============================= -->
<footer class="footer" id="footer">
  <p class="footer__eyebrow">Villa Selene</p>
  <h2 class="footer__headline">Some places are not found.<br />They are remembered.</h2>
  <a href="#" id="footerCta" class="cta">
    <span class="cta__label">Discover the Property</span>
  </a>
  <div class="footer__meta">
    <span>Villa Selene, est. private</span>
    <span aria-hidden="true">·</span>
    <a href="mailto:contact@villaselene.example">contact@villaselene.example</a>
  </div>
</footer>

<!-- ============================= VENDOR (CDN) ============================= -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>

<!-- ============================= APP ============================= -->
<script src="js/chapters.config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
